[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scope-ltx-gpu-poor"
version = "0.3.8"
description = "LTX 2.3 audio-video generation plugin for Daydream Scope — modified for lower-VRAM GPUs (16 GB) with LTX API text encoder and frame-chain"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torchaudio==2.9.1",
    "safetensors",
    "einops",
    "transformers",
    "sentencepiece",
]

[tool.setuptools.package-data]
scope_ltx_gpu_poor = ["gemma_config/*.json"]

[project.entry-points.scope]
scope-ltx-gpu-poor = "scope_ltx_gpu_poor"

[dependency-groups]
dev = [
    "daydream-scope",
]

[tool.uv]
override-dependencies = [
]

[tool.uv.sources]
daydream-scope = { git = "https://github.com/daydreamlive/scope" }
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
